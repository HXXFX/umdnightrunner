function variantOf(base, o = {}) {
  const legS = o.legLen ?? 1, armS = o.armLen ?? 1, girth = o.girth ?? 1;
  const hipW = o.hipW ?? 1, headS = o.headS ?? 1, torsoS = o.torso ?? 1;
  const shoW = o.shoulderW ?? 1, armG = o.armGirth ?? 1, legG = o.legGirth ?? 1;
  const PELVIS = 0.56, SHOULDER = 0.83;
  const lift = PELVIS * (legS - 1);
  const nodes = base.nodes.map(n => {
    const m = { ...n };
    m.r = n.r * girth * (n.part === 'head' ? headS : 1)
                     * (n.part === 'arm' ? armG : 1)
                     * (n.part === 'leg' ? legG : 1);
    if (n.part === 'leg') { m.y = n.y * legS; m.z = n.z * hipW; }
    else if (n.part === 'arm') { m.y = SHOULDER - (SHOULDER - n.y) * armS + lift; m.z = n.z * shoW; }
    else { m.y = (n.y - PELVIS) * torsoS + PELVIS + lift; }
    return m;
  });
  const drop = Math.min(...nodes.filter(n => n.sub !== 'fist').map(n => n.y - n.r));
  for (const n of nodes) { n.y -= drop; n.rx = n.x; n.ry = n.y; n.rz = n.z; }
  return { ...base, nodes, name: o.name ?? base.name, good: o.good ?? base.good };
}

function tape(skel) {
  const n = skel.nodes.filter(p => p.sub !== 'fist');
  const chest = n.find(p => p.part === 'torso' && p.y === Math.max(...n.filter(q => q.part === 'torso').map(q => q.y))) || n[1];
  const arms = n.filter(p => p.part === 'arm' && p.sub !== 'fist');
  const reach = arms.length ? Math.max(...arms.map(p => Math.hypot(p.x - chest.x, p.y - chest.y, p.z - chest.z))) : 0;
  const height = Math.max(...n.map(p => p.y + p.r));
  const mass = n.reduce((s, p) => s + p.r * p.r * p.r, 0) * 190;
  const com = n.reduce((s, p) => s + p.y * p.r ** 3, 0) / n.reduce((s, p) => s + p.r ** 3, 0);
  const feet = n.filter(p => p.y - p.r < 0.03);
  const base = feet.length ? Math.max(...feet.map(p => Math.abs(p.z))) * 2 : 0;
  return { height, reach, mass, com, base, joints: skel.nodes.length,
           tippy: base > 0.001 ? com / base : 99 };
}

function buildOf(o = {}) {

  });
}

const MASS_K = 2700 * 0.2;

function partMass(key, len, thick = 1) {
  const RP = PARTS[key];
  if (!RP || !(RP.mass > 0) || !(RP.realLen > 0)) return null;
  const s = len / RP.realLen;
  return RP.mass * s * s * s * thick * thick;
}

const PARENT = (() => {
  const par = new Array(BIPED.nodes.length).fill(-1);
  const of = new Array(BIPED.nodes.length).fill(null);
  for (const B of BODY_BONES) for (const [a, b] of B.pairs) { par[b] = a; of[b] = B.key; }
  return { par, of };
})();

const ORDER = (() => {
  const out = [], visit = i => { out.push(i); PARENT.par.forEach((p, j) => { if (p === i) visit(j); }); };
  visit(0);
  return out;
})();

function boneBuild(spec = {}, base) {
  const rest = (base || spec.base || BIPED).nodes;
  const w = spec.weight ?? 1;
  const nodes = rest.map(n => ({ ...n }));
  for (const i of ORDER) {
    const p = PARENT.par[i];
    if (p < 0) continue;
    const b = spec[PARENT.of[i]] || {};
    const L = b.len ?? 1;
    nodes[i].x = nodes[p].x + (rest[i].x - rest[p].x) * L;
    nodes[i].y = nodes[p].y + (rest[i].y - rest[p].y) * L;
    nodes[i].z = nodes[p].z + (rest[i].z - rest[p].z) * L;
    nodes[i].r = rest[i].r * (b.thick ?? 1) * w;
    nodes[i].r0 = rest[i].r;
    nodes[i].bone = PARENT.of[i];
    nodes[i].len = L;
    nodes[i].fit = b.fit ?? 1;
  }
  for (const [a, b] of HAND_BONE.pairs) {
    const h = nodes[a], e = nodes[PARENT.par[a]], dx = h.x - e.x, dy = h.y - e.y, dz = h.z - e.z, dl = Math.hypot(dx, dy, dz) || 1;
    nodes[b].x = h.x + dx / dl * HAND_LEN * h.r; nodes[b].y = h.y + dy / dl * HAND_LEN * h.r; nodes[b].z = h.z + dz / dl * HAND_LEN * h.r;
    nodes[b].r = h.r * 0.85;
  }
  nodes[0].r = rest[0].r * ((spec.spine || {}).thick ?? 1) * w;
  nodes[0].r0 = rest[0].r;
  nodes[0].bone = 'spine';
  const drop = Math.min(...nodes.filter(n => n.sub !== 'fist').map(n => n.y - n.r));
  for (const n of nodes) { n.y -= drop; n.rx = n.x; n.ry = n.y; n.rz = n.z; }
  const src = base || spec.base || BIPED;
  return { ...src, nodes, name: spec.name || 'your build', good: spec.good || '' };
}

function boneTape(skel, fill = {}, o = {}) {
  const n = skel.nodes;
  let mass = 0, moment = 0, momentX = 0, momentZ = 0, hitSum = 0, bones = 0;
  const atBall = new Float64Array(n.length);
  let handMass = 0;
  for (const B of BODY_BONES) for (const [a, b] of B.pairs) {
    const k = fill[B.key] ?? (B === HAND_BONE ? SLOT_PARTS.hand : B.key === 'foot' ? SLOT_PARTS.foot : undefined);
    const RP = PARTS[k];
    const F = RP ? { dens: RP.fill, hit: 0.6 + RP.fill * 0.6 }
                 : (SHAPES[k] || FILLS[k] || SHAPES.shell);
    const len = Math.hypot(n[b].x - n[a].x, n[b].y - n[a].y, n[b].z - n[a].z);
    const r = (n[a].r + n[b].r) / 2;
    const thick = ((n[a].r / (n[a].r0 || n[a].r)) + (n[b].r / (n[b].r0 || n[b].r))) / 2;
    const share = B.key === 'pelvis' ? 0.5 : 1;
    const m = share * (RP ? (partMass(k, len, thick) ?? Math.PI * r * r * len * F.dens * MASS_K)
                          : Math.PI * r * r * len * F.dens * MASS_K);
    mass += m; atBall[a] += m / 2; atBall[b] += m / 2;
    if (B === HAND_BONE) handMass += m;
    moment += m * (n[a].y + n[b].y) / 2;
    momentX += m * (n[a].x + n[b].x) / 2;
    momentZ += m * (n[a].z + n[b].z) / 2;
    hitSum += F.hit; bones++;
  }
  const chest = n[1];
  const built = mass;
  let motorKg = 0;
  if (o.motors) {
    const take = motorTakes(o.motors, n.map(q => q.sub), atBall, BODY_BONES.flatMap(B => B.pairs), built);
    for (let i = 0; i < n.length; i++) {
      const d = take[i];
      if (!d) continue;
      mass -= d; motorKg += d;
      moment -= d * n[i].y; momentX -= d * n[i].x; momentZ -= d * n[i].z;
    }
  }
  const packs = Math.max(0, Math.min(PACK.max, o.packs | 0));
  const bare = built;
  const pm = bare * PACK.share;
  const half = packHalf(pm);
  let packMassTotal = 0;
  for (let k = 0; k < packs; k++) {
    const at = packAt(k, half);
    mass += pm; packMassTotal += pm;
    moment += pm * (chest.y + at.up);
    momentX += pm * (chest.x - at.back);
    momentZ += pm * chest.z;
  }
  const M = rigBox(skel, fill);
  const B = M.box;
  const height = Number.isFinite(B.y1) ? B.y1 - Math.min(0, B.y0) : 0;
  const foot = M.parts.foot;
  const base = foot && Number.isFinite(foot.z1) ? foot.z1 - foot.z0
             : (() => { const f = n.filter(p => p.y - p.r < 0.03);
                        return f.length ? Math.max(...f.map(p => Math.abs(p.z))) * 2 : 0; })();
  const arms = n.filter(p => p.part === 'arm' && p.sub !== 'fist');
  let reach = 0, reachAt = null;
  for (const p of arms) {
    const d = Math.hypot(p.x - chest.x, p.y - chest.y, p.z - chest.z);
    if (d > reach) { reach = d; reachAt = [p.x, p.y, p.z]; }
  }
  const com = mass > 0 ? moment / mass : 0;
  const comAt = mass > 0 ? [momentX / mass, moment / mass, momentZ / mass] : [0, 0, 0];
  return { height, reach, mass, com, comAt, base, bones: BONES.length, box: B, parts: M.parts,
           packs, packMass: packMassTotal, packHalf: half, packOne: pm, bare, motorKg, handMass,
           reachAt, chest: [chest.x, chest.y, chest.z],
           hit: bones ? hitSum / bones : 1,
           tippy: base > 0.001 ? com / base : 99 };
}

  main { padding-bottom: 60px; }
  .step { display: grid; grid-template-columns: 40px 1fr; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }

  .task .what { color: var(--dim); font-size: 14px; margin-top: 1px; }
  .task .meta { font-size: 13px; color: var(--dim); margin-top: 4px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.run { background: var(--run-bg); color: var(--run); }

  details.adv { margin-top: 12px; }
  details summary { cursor: pointer; color: var(--dim); font-size: 14px; }

  textarea { min-height: 70px; resize: vertical; }
  .note { font-size: 13px; color: var(--dim); margin: 6px 0 0; }

  .est { margin-top: 14px; border-radius: 10px; padding: 12px 14px; background: var(--soft); }

  details.log { margin-top: 18px; }
  #log { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Consolas, monospace; color: var(--dim); max-height: 420px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }

  @media (max-width: 560px) {
    .step { grid-template-columns: 30px 1fr; gap: 10px; padding: 14px 12px; }
    .n { width: 28px; height: 28px; font-size: 14px; }

    .checks li { grid-template-columns: 26px 1fr; }
    .checks .v { grid-column: 2; }
    .file { grid-template-columns: 1fr auto; }
    .file .st { grid-column: 1; }

  }
`;

const WORDS = { name: 'Night Runner', tagline: 'Runs a job on this computer.', storage: 'night-runner', job: 'job', jobs: 'jobs',

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function markup(W) {

function mount(job, { spawn, loadModule = null, build = null } = {}) {
  const W = { ...WORDS, ...(job.APP || {}), chart: { ...WORDS.chart, ...((job.APP || {}).chart || {}) } };
  const style = document.createElement('style'); style.textContent = STYLE; document.head.appendChild(style);
  document.body.insertAdjacentHTML('beforeend', markup(W));
  document.title = W.name;
  const $ = id => document.getElementById(id);
  const TASKS = job.TASKS, textOf = t => t.settings !== undefined ? t.settings : t.flags;
  const P = { total: 0, done: 0, batch: 0, part: 0, t0: 0, from: 0, news: 0, g: 0, gens: 0, best: [], mean: [], perStep: 0 };
  const news = () => { P.news = Date.now(); };
  const say = s => { $('log').textContent += s + '\n'; $('log').scrollTop = $('log').scrollHeight; news(); };
  $('buildText').innerHTML = build ? `Built from ${esc(W.built)} <b>${esc(build.commit)}</b> (${esc(build.date)})` : 'Served from the working folder, not a built copy';
  const tonight = TASKS.find(t => t.id === job.TONIGHT) || null;
  const taskNamed = text => (TASKS.find(t => textOf(t).trim() === text.trim()) || {}).id || null;
  const out = { state: 'idle', log: [], result: null, estimateMin: null };
  window.__runner = out; window.__train = out;
  const ui = { task: (tonight || TASKS[0]).id, gpu: 'looking', prep: null, prepS: null, prepErr: null, measure: 'none', est: null, measureErr: null,
    run: 'idle', err: null, stopAsked: false, resume: null, files: [], filesFrom: null, filesSub: null, outcome: null, wake: 'wakeLock' in navigator ? 'ready' : 'none',
    open: { 1: false, 2: false }, file: null };

  const E = job.engines({ spawn, say, onAnswer: k => { P.part += k; news(); }, onPart: f => { if (P.batch) P.part = Math.round(P.batch * f); news(); } });
  const cpuEngine = E.cpu, hasCard = typeof E.card === 'function';
  let cardP = null, engine = cpuEngine;
  const cardOf = () => cardP || (cardP = E.card().catch(e => { cardP = null; throw e; }));
  async function useEngine(which) {
    $('measure').disabled = true; $('start').disabled = true; out.engineReady = false;
    ui.measure = 'none'; ui.est = null; out.estimateMin = null;
    if (which === 'card') {
      ui.prep = Date.now(); ui.prepErr = null; render();
      try { engine = await cardOf(); ui.prepS = engine.compiled && engine.compiled.seconds ? engine.compiled.seconds : (Date.now() - ui.prep) / 1000; }
      catch (e) { engine = cpuEngine; $('engineSel').value = 'cpu'; ui.prepErr = e.message; say('the graphics card could not be used: ' + e.message + ' - on the processor instead'); }
      ui.prep = null;
    } else engine = cpuEngine;
    out.engine = engine.name; $('engineName').textContent = engine.name;
    $('measure').disabled = false; out.engineReady = true; render();
  }
  $('engineSel').onchange = () => useEngine($('engineSel').value);
  const pick = v => { if ($('engineSel').value === v && out.engineReady) return; $('engineSel').value = v; $('engineSel').onchange(); };
  $('useCard').onclick = () => pick('card'); $('useCpu').onclick = () => pick('cpu');
  const whenReady = () => new Promise(r => { const t = setInterval(() => { if (out.engineReady) { clearInterval(t); r(); } }, 200); });
  $('engineName').textContent = engine.name;
  const cardFound = (async () => { try { const a = navigator.gpu && await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }); const i = a && a.info;
    $('cardName').textContent = a ? [i.vendor, i.architecture, i.description].filter(Boolean).join(' ') || 'yes' : 'none'; return !!a; } catch { $('cardName').textContent = 'none'; return false; } })();
  cardFound.then(ok => { ui.gpu = ok ? 'found' : 'none';
    if (!ok || !hasCard) { $('engineSel').value = 'cpu'; $('engineSel').querySelector('option[value=card]').disabled = true; out.engineReady = true; render(); }
    else { $('engineSel').value = 'card'; useEngine('card'); } });

  let wake = null;
